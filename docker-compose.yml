version: '3.9'

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  collector_db:
    image: postgres:15
    container_name: collector_db
    environment:
      TZ: "Europe/Moscow"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: Collector
    ports:
      - "5432:5432"
    volumes:
      - collector_pgdata:/var/lib/postgresql/data
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 5s
        timeout: 5s
        retries: 5
        
  collector_app:
    build: ./Collector
    container_name: collector_app
    depends_on:
      collector_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      TZ: "Europe/Moscow"
      ProcessingSettings__InputFolder: "/app/input"
      PROCESSING_FOLDER_PATH: /files
      ConnectionStrings__Default: Host=collector_db;Port=5432;Database=Collector;Username=postgres;Password=postgres
      ProcessingSettings__RunMode: "OneTime"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - ./Collector/dnaborshchikova_github.Bea.Collector.WorkerService/TestData:/app/input

  collector_pgadmin:
    image: dpage/pgadmin4
    container_name: collector_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - collector_db
   
  eventmanagement_db:
    image: postgres:15
    container_name: eventmanagement_db
    environment:
      TZ: "Europe/Moscow"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: EventManagement
    ports:
      - "5433:5432"
    volumes:
      - eventmanagement_pgdata:/var/lib/postgresql/data
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 5s
        timeout: 5s
        retries: 5
        
  eventmanagement_app:
    build: ./EventManagement
    container_name: eventmanagement_app
    depends_on:
      eventmanagement_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      TZ: "Europe/Moscow"
      ConnectionStrings__Default: Host=eventmanagement_db;Port=5432;Database=EventManagement;Username=postgres;Password=postgres
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      DOTNET_ENVIRONMENT: Development
      
  eventmanagement_pgadmin:
    image: dpage/pgadmin4
    container_name: eventmanagement_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5051:80"
    depends_on:
      - eventmanagement_db
      
volumes:
  eventmanagement_pgdata:
  collector_pgdata: